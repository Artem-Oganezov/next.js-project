# Локальная разработка: Mongo + Redis без app.
# npm run dev + MONGODB_URI=mongodb://127.0.0.1:27017/game REDIS_URL=redis://127.0.0.1:6379
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
