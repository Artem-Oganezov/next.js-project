# Production stack: 2× app + score worker + nginx LB.
# MongoDB and Redis are external (managed) — set REDIS_URL / MONGODB_URI in .env.
#
# Setup:
#   cp .env.production.example .env
#   nano .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Scale workers on traffic spikes:
#   docker compose -f docker-compose.prod.yml up -d --scale worker=2
#
# Second VPS (optional): run only `app` from the same image + .env and add the
# host to nginx upstream (see nginx.example.conf) or use a host-level LB.

x-app-common: &app-common
  build:
    context: .
    args:
      NEXT_PUBLIC_REVIVE_AD_PROVIDER: ${NEXT_PUBLIC_REVIVE_AD_PROVIDER:-none}
      NEXT_PUBLIC_GAM_AD_UNIT_PATH: ${NEXT_PUBLIC_GAM_AD_UNIT_PATH:-}
      NEXT_PUBLIC_GAM_NETWORK_ID: ${NEXT_PUBLIC_GAM_NETWORK_ID:-}
      NEXT_PUBLIC_GAM_AD_UNIT_NAME: ${NEXT_PUBLIC_GAM_AD_UNIT_NAME:-}
      NEXT_PUBLIC_GAM_AD_FORMAT: ${NEXT_PUBLIC_GAM_AD_FORMAT:-interstitial}
      NEXT_PUBLIC_REVIVE_AD_SLOT_ID: ${NEXT_PUBLIC_REVIVE_AD_SLOT_ID:-revive-ad-slot}
  env_file: .env
  environment:
    NODE_ENV: production
  expose:
    - "3000"
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  app-a:
    <<: *app-common

  app-b:
    <<: *app-common

  worker:
    build: .
    command: ["node", "score-worker.cjs"]
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    restart: unless-stopped
