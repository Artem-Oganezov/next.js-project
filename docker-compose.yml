# Single VPS: app + redis. Mongo is external (Atlas or a separate server)
# so data lives separately from app nodes and additional servers connect without migrations.
#
# Scaling: on new servers run ONLY app (same image, same .env with shared
# MONGODB_URI/REDIS_URL) and add them to the load balancer upstream — see nginx.example.conf.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_REVIVE_AD_PROVIDER: ${NEXT_PUBLIC_REVIVE_AD_PROVIDER:-none}
        NEXT_PUBLIC_GAM_AD_UNIT_PATH: ${NEXT_PUBLIC_GAM_AD_UNIT_PATH:-}
        NEXT_PUBLIC_GAM_NETWORK_ID: ${NEXT_PUBLIC_GAM_NETWORK_ID:-}
        NEXT_PUBLIC_GAM_AD_UNIT_NAME: ${NEXT_PUBLIC_GAM_AD_UNIT_NAME:-}
        NEXT_PUBLIC_GAM_AD_FORMAT: ${NEXT_PUBLIC_GAM_AD_FORMAT:-interstitial}
        NEXT_PUBLIC_REVIVE_AD_SLOT_ID: ${NEXT_PUBLIC_REVIVE_AD_SLOT_ID:-revive-ad-slot}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "score-worker.cjs"]
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Port is not published externally: app connects over the compose internal network.
    # For shared Redis across multiple servers, run managed Redis on a separate
    # host and update REDIS_URL.

volumes:
  redis_data:
