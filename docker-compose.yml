# Один VPS: app + redis. Mongo — внешний (Atlas или отдельный сервер),
# чтобы данные жили отдельно от app-нод и второй сервер подключался без миграций.
#
# Масштабирование: на новых серверах поднимай ТОЛЬКО app (тот же image,
# тот же .env с общими MONGODB_URI/REDIS_URL) и добавляй их в upstream
# балансировщика — см. nginx.example.conf.
services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "score-worker.cjs"]
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Порт наружу не публикуем: app ходит по внутренней сети compose.
    # Для общего Redis на несколько серверов вынеси его на отдельный
    # хост/Upstash и поменяй REDIS_URL.

volumes:
  redis_data:
