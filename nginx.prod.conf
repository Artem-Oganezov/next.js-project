# Used by docker-compose.prod.yml (nginx service).
# TLS: terminate at Cloudflare, or put Caddy/certbot on the host in front of port 80.

upstream game_app {
    least_conn;
    server app-a:3000 max_fails=3 fail_timeout=15s;
    server app-b:3000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://game_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # lib/api/http.ts getClientIp() reads the first X-Forwarded-For address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /api/health {
        proxy_pass http://game_app;
        access_log off;
    }
}
