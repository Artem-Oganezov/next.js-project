# Балансировщик для нескольких app-серверов.
# Ставится на отдельный маленький VPS (или используй LB хостера / Cloudflare).
#
# Подключение нового сервера:
#   1. docker run с тем же image и тем же .env (общие MONGODB_URI, REDIS_URL, AUTH_SECRET)
#   2. добавить строку server в upstream ниже
#   3. nginx -s reload

upstream game_app {
    least_conn;
    server 10.0.0.1:3000 max_fails=3 fail_timeout=15s;
    # server 10.0.0.2:3000 max_fails=3 fail_timeout=15s;
    # server 10.0.0.3:3000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name example.com;
    # SSL: certbot --nginx -d example.com (добавит listen 443 сам)

    location / {
        proxy_pass http://game_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # getClientIp() на бэке читает первый адрес из X-Forwarded-For
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://game_app;
        access_log off;
    }
}
